name: gold-bot
on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub only runs schedules from the default branch
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-bot
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m goldbot run
      - name: Save paper account and journal
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "bot: cycle $(date -u +%FT%RZ)" && git push)
